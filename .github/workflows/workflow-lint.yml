# Lint the workflows themselves: actionlint (syntax, expressions, shellcheck) and zizmor (security
# of workflows and dependabot.yml).
name: Workflow lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.1"
          enable-cache: false
      - name: actionlint
        run: uvx --from "actionlint-py==1.7.12.25" actionlint -color
      - name: zizmor
        env:
          # Lets zizmor check pinned SHAs against their tags; read-only, this repo's own token.
          GH_TOKEN: ${{ github.token }}
        run: uvx "zizmor==1.33.1" --format=github .
