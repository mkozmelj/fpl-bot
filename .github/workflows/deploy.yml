# Ship every merge to main (ADR 0001, ADR 0003; tickets 16, 23, 42). One image is built once,
# scanned with Trivy, pushed to public GHCR with GITHUB_TOKEN, signed keylessly with cosign and
# given a build-provenance attestation. The deploy job then verifies that exact digest, points the
# `production` tag Railway's service pulls at it, runs `railway redeploy`, waits up to 5 minutes for
# `ready sha=<this commit>` in the new deployment's logs, and rolls back if it doesn't appear.
# Migrations run in Railway's pre-deploy command (`fplbot migrate`) from the same image; CI never
# holds the database URL. Runbook: docs/runbook-secrets.md, "Deploys".
#
# Runs only where the repository variable RAILWAY_SERVICE_ID is set (the owner's repo; a fork has
# no such variable), and the Railway project token is the only secret, held by the `production`
# environment, which only main may use.
name: Deploy

on:
  push:
    branches: [main]

permissions: {}

# Deploys queue in order; a running deploy is never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
  RAILWAY_CLI_VERSION: "5.75.0"
  RAILWAY_CLI_SHA256: ba5d9fb5dce1c59789f4216e6b754becd75025ed740388452be55aae83720400
  COSIGN_VERSION: v3.1.4

jobs:
  image:
    name: Build, scan, sign and publish the image
    if: vars.RAILWAY_SERVICE_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to this repository's GHCR package
      id-token: write # keyless cosign signature and the provenance attestation
      attestations: write # store the provenance attestation
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        id: build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --pull \
            --build-arg "GIT_SHA=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --tag "$image:sha-$GITHUB_SHA" .
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Install Trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
      - name: Scan (fail on fixable HIGH/CRITICAL)
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress --timeout 15m "$IMAGE:sha-$GITHUB_SHA"
      - name: Push
        id: push
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" \
            --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}

  deploy:
    name: Deploy to Railway
    needs: image
    if: vars.RAILWAY_SERVICE_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read # the Railway helper script
      packages: write # move the `production` tag
      attestations: read # verify the provenance attestation
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      # Signed by this workflow, on main, in this repository: nothing else may reach Railway.
      SIGNER: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Verify the signature and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy.yml" \
            --source-ref refs/heads/main > /dev/null
          echo "verified $IMAGE@$DIGEST"
      - name: Install the Railway CLI
        run: |
          archive="railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/$archive"
          echo "${RAILWAY_CLI_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/railway"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/railway"
          install -m 0755 "$(find "$RUNNER_TEMP/railway" -type f -name railway | head -n 1)" \
            "$RUNNER_TEMP/railway-cli"
          "$RUNNER_TEMP/railway-cli" --version
      - name: Record the running deployment
        id: previous
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "deployment=$(.github/scripts/railway.sh active)" >> "$GITHUB_OUTPUT"
          previous=$(docker buildx imagetools inspect "$IMAGE:production" \
            --format '{{json .Manifest}}' 2> /dev/null | jq -r .digest || true)
          echo "digest=$previous" >> "$GITHUB_OUTPUT"
      - name: Promote the verified digest to the production tag
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE:production" "$IMAGE@$DIGEST"
          tagged=$(docker buildx imagetools inspect "$IMAGE:production" \
            --format '{{json .Manifest}}' | jq -r .digest)
          if [[ "$tagged" != "$DIGEST" ]]; then
            echo "production tag resolves to $tagged, expected $DIGEST" >&2
            exit 1
          fi
      - name: Redeploy
        id: redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PREVIOUS: ${{ steps.previous.outputs.deployment }}
        run: |
          # Railway re-pulls the service's image tag (`:production`) on redeploy.
          "$RUNNER_TEMP/railway-cli" redeploy --service "$RAILWAY_SERVICE_ID" --yes
          echo "deployment=$(.github/scripts/railway.sh new-since "$PREVIOUS")" >> "$GITHUB_OUTPUT"
      - name: Smoke check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOYMENT: ${{ steps.redeploy.outputs.deployment }}
        run: .github/scripts/railway.sh smoke "$DEPLOYMENT" "$GITHUB_SHA" 300
      - name: Roll back
        if: >-
          (failure() || cancelled())
          && (steps.promote.outcome == 'success' || steps.promote.outcome == 'failure')
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.previous.outputs.deployment }}
          PREVIOUS_DIGEST: ${{ steps.previous.outputs.digest }}
          DEPLOYMENT: ${{ steps.redeploy.outputs.deployment }}
        run: |
          if [[ "$PREVIOUS_DIGEST" == sha256:* ]]; then
            echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            docker buildx imagetools create --tag "$IMAGE:production" "$IMAGE@$PREVIOUS_DIGEST"
          fi
          if [[ -z "$PREVIOUS" ]]; then
            echo "no earlier successful deployment to roll back to" >&2
            exit 1
          fi
          .github/scripts/railway.sh rollback "$PREVIOUS" "$DEPLOYMENT"
